  <style>
    :root {
      --power-cyan: #16d9ff;
      --power-blue: #3975ff;
      --power-purple: #9b4dff;
    }
    #power-splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(50, 105, 255, .23), transparent 28%),
        radial-gradient(circle at 50% 50%, #0a1230 0%, #030610 62%, #010208 100%);
      transition: opacity .55s ease, visibility .55s ease;
    }
    #power-splash.power-splash-leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .power-splash-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: min(88vw, 440px);
      text-align: center;
      animation: power-rise .8s cubic-bezier(.2, .8, .2, 1) both;
    }
    .power-splash-logo {
      width: min(62vw, 260px);
      aspect-ratio: 1;
      display: block;
      margin: 0 auto;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(135, 228, 255, .8);
      box-shadow:
        0 0 34px rgba(22, 217, 255, .72),
        0 0 90px rgba(106, 54, 255, .4);
      animation: power-logo-pulse 2.6s ease-in-out infinite;
    }
    .power-splash-kicker {
      margin: 0;
      color: rgba(255,255,255,.62);
      font: 700 10px/1 Inter, system-ui, sans-serif;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    .power-splash-title {
      margin: 0;
      color: white;
      font: 900 clamp(28px, 7vw, 46px)/1 Inter, system-ui, sans-serif;
      letter-spacing: -.05em;
    }
    .power-splash-title span {
      display: inline-block;
      background: linear-gradient(90deg, #fff, var(--power-cyan), #a96dff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 28px rgba(54, 211, 255, .24);
      letter-spacing: -.07em;
    }
    .power-splash-copy {
      max-width: 31ch;
      margin: 0;
      color: rgba(255,255,255,.62);
      font: 14px/1.55 Inter, system-ui, sans-serif;
    }
    #power-enter {
      min-width: 190px;
      min-height: 48px;
      padding: 0 25px;
      border: 0;
      border-radius: 999px;
      color: #031027;
      background: linear-gradient(100deg, #fff, #a9f2ff);
      box-shadow: 0 0 24px rgba(79, 218, 255, .28);
      font: 900 12px/1 Inter, system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    #power-enter:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 34px rgba(79, 218, 255, .5);
    }
    #power-live-button {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 90;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 7px 17px 7px 10px;
      border: 1px solid rgba(116, 226, 255, .45);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, rgba(20, 38, 91, .96), rgba(51, 20, 107, .96));
      box-shadow: 0 10px 34px rgba(0,0,0,.35), 0 0 24px rgba(44, 180, 255, .22);
      font: 800 11px/1 Inter, system-ui, sans-serif;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    #power-live-button:hover,
    #power-live-button.power-speaking {
      transform: translateY(-3px);
      border-color: var(--power-cyan);
      box-shadow: 0 12px 36px rgba(0,0,0,.4), 0 0 32px rgba(22, 217, 255, .42);
    }
    .power-live-icon {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: linear-gradient(135deg, #12dfff, #754eff);
      box-shadow: 0 0 14px rgba(22, 217, 255, .55);
      font-size: 16px;
    }
    .power-live-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }
    .power-live-text small {
      color: rgba(255,255,255,.58);
      font-size: 9px;
      letter-spacing: .03em;
      text-transform: none;
    }
    .power-header-logo {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      object-fit: cover;
      border: 1px solid rgba(132, 226, 255, .7);
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(30, 174, 255, .5);
    }
    body {
      background:
        radial-gradient(circle at 8% 0%, rgba(37, 99, 235, .16), transparent 28rem),
        radial-gradient(circle at 92% 22%, rgba(124, 58, 237, .12), transparent 26rem),
        #070b18;
    }
    #root > div {
      background: transparent !important;
    }
    #root header.power-modern-header {
      background: rgba(7, 11, 24, .78);
      border-bottom-color: rgba(126, 190, 255, .16);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .18);
    }
    #root header.power-modern-header > div {
      max-width: 1360px;
    }
    #power-menu-toggle {
      position: fixed;
      top: 13px;
      right: 18px;
      z-index: 120;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 40px;
      padding: 0 15px 0 11px;
      border: 1px solid rgba(135, 209, 255, .3);
      border-radius: 999px;
      color: #fff;
      background: rgba(17, 29, 62, .88);
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      font: 800 10px/1 Inter, system-ui, sans-serif;
      letter-spacing: .1em;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }
    #power-menu-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--power-cyan);
      background: rgba(29, 52, 104, .95);
    }
    .power-menu-icon {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      color: #071124;
      background: linear-gradient(135deg, #9ff3ff, #7b61ff);
      font-size: 15px;
      line-height: 1;
    }
    #power-menu-backdrop {
      position: fixed;
      inset: 0;
      z-index: 110;
      background: rgba(0, 3, 14, .56);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
      backdrop-filter: blur(5px);
    }
    #power-menu-panel {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 130;
      display: flex;
      flex-direction: column;
      width: min(86vw, 340px);
      padding: 28px 18px;
      border-right: 1px solid rgba(148, 221, 255, .18);
      background:
        linear-gradient(180deg, rgba(16, 28, 62, .98), rgba(6, 10, 26, .99)),
        #080d20;
      box-shadow: 20px 0 70px rgba(0,0,0,.42);
      transform: translateX(-105%);
      transition: transform .32s cubic-bezier(.2,.8,.2,1);
    }
    body.power-menu-open #power-menu-backdrop {
      opacity: 1;
      visibility: visible;
    }
    body.power-menu-open #power-menu-panel {
      transform: translateX(0);
    }
    .power-menu-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 27px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .power-menu-brand img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(41, 195, 255, .42);
    }
    .power-menu-brand strong {
      display: block;
      color: #fff;
      font: 900 17px/1 Inter, system-ui, sans-serif;
      letter-spacing: -.04em;
    }
    .power-menu-brand span {
      display: block;
      margin-top: 5px;
      color: rgba(255,255,255,.48);
      font: 700 9px/1 Inter, system-ui, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .power-menu-close {
      margin-left: auto;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      color: rgba(255,255,255,.72);
      background: rgba(255,255,255,.06);
      font-size: 18px;
      cursor: pointer;
    }
    .power-menu-label {
      margin: 25px 10px 10px;
      color: rgba(255,255,255,.38);
      font: 800 9px/1 Inter, system-ui, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .power-menu-item {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      margin: 3px 0;
      padding: 13px 12px;
      border: 1px solid transparent;
      border-radius: 15px;
      color: rgba(255,255,255,.74);
      background: transparent;
      text-align: left;
      font: 700 13px/1 Inter, system-ui, sans-serif;
      cursor: pointer;
      transition: color .2s ease, background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .power-menu-item:hover {
      transform: translateX(3px);
      border-color: rgba(115, 222, 255, .2);
      color: #fff;
      background: linear-gradient(90deg, rgba(47, 119, 255, .23), rgba(143, 72, 255, .14));
    }
    .power-menu-item i {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      color: #a9f4ff;
      background: rgba(73, 162, 255, .12);
      font-style: normal;
      font-size: 16px;
    }
    .power-menu-foot {
      margin-top: auto;
      padding: 15px 12px 5px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.4);
      font: 600 11px/1.5 Inter, system-ui, sans-serif;
    }
    #power-developer-panel {
      position: fixed;
      inset: 0;
      z-index: 140;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(1, 4, 17, .78);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .25s ease, visibility .25s ease;
      backdrop-filter: blur(10px);
    }
    body.power-dev-open #power-developer-panel {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .power-developer-card {
      position: relative;
      width: min(94vw, 700px);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      border: 1px solid rgba(104, 218, 255, .28);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 0%, rgba(65, 168, 255, .2), transparent 38%),
        linear-gradient(145deg, rgba(20, 35, 78, .98), rgba(8, 12, 29, .99));
      box-shadow: 0 28px 90px rgba(0,0,0,.58), 0 0 45px rgba(42, 163, 255, .12);
      animation: power-rise .35s ease both;
    }
    .power-developer-glow {
      width: 86px;
      height: 86px;
      margin: 0 auto 15px;
      padding: 4px;
      border: 1px solid rgba(128, 235, 255, .75);
      border-radius: 50%;
      background: linear-gradient(135deg, #1fe3ff, #714eff);
      box-shadow: 0 0 32px rgba(42, 206, 255, .4);
    }
    .power-developer-glow img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .power-developer-card h2 {
      margin: 0;
      color: #fff;
      text-align: center;
      font: 900 clamp(24px, 5vw, 34px)/1 Inter, system-ui, sans-serif;
      letter-spacing: -.06em;
    }
    .power-developer-card > p {
      margin: 9px auto 24px;
      color: rgba(255,255,255,.58);
      text-align: center;
      font: 500 13px/1.5 Inter, system-ui, sans-serif;
    }
    .power-developer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .power-credit {
      position: relative;
      overflow: hidden;
      min-height: 92px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      background: rgba(255,255,255,.055);
    }
    .power-credit::after {
      content: "";
      position: absolute;
      top: -30px;
      right: -25px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(31, 222, 255, .11);
      filter: blur(3px);
    }
    .power-credit-role {
      display: block;
      margin-bottom: 8px;
      color: #86eaff;
      font: 800 9px/1 Inter, system-ui, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .power-credit-name {
      display: block;
      color: #fff;
      font: 800 14px/1.3 Inter, system-ui, sans-serif;
    }
    .power-developer-close {
      display: block;
      width: 100%;
      min-height: 44px;
      margin-top: 18px;
      border: 1px solid rgba(134, 234, 255, .28);
      border-radius: 999px;
      color: #061228;
      background: linear-gradient(100deg, #c7f9ff, #a184ff);
      font: 900 11px/1 Inter, system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    @media (max-width: 520px) {
      #power-menu-toggle { top: 12px; right: 12px; }
      #root header.power-modern-header > div { padding-right: 70px; }
      .power-developer-card { padding: 22px 16px 16px; border-radius: 22px; }
      .power-developer-grid { grid-template-columns: 1fr; gap: 9px; }
      .power-credit { min-height: auto; padding: 14px; }
    }
    @keyframes power-logo-pulse {
      0%, 100% { transform: scale(.97); }
      50% { transform: scale(1.02); }
    }
    @keyframes power-rise {
      from { opacity: 0; transform: translateY(18px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (max-width: 520px) {
      #power-live-button { right: 14px; bottom: 14px; }
      .power-live-text small { display: none; }
      #power-live-button { padding-right: 12px; }
      #root main { padding: 16px 12px 92px !important; }
      #root header.power-modern-header > div { min-height: 60px; }
      .power-header-logo { width: 44px; height: 44px; flex-basis: 44px; }
      .power-splash-panel { gap: 17px; }
      .power-splash-logo { width: min(62vw, 220px); }
      .power-splash-copy { font-size: 13px; }
      #power-menu-panel { width: min(91vw, 340px); padding: 22px 14px; }
    }
  #power-live-button { display: none !important; }
</style>

  <script>
    (() => {

      const logoFallback = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`

      const playOpeningSound = () => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const audio = new AudioContext();
          const now = audio.currentTime;
          const master = audio.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.exponentialRampToValueAtTime(0.13, now + 0.03);
          master.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
          master.connect(audio.destination);
          [220, 330, 440, 660].forEach((frequency, index) => {

            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(frequency, now + index * 0.08);
            oscillator.connect(master);
            oscillator.start(now + index * 0.08);

          <h1 class="power-splash-title">Welcome to <span>MIDFEAST AI</span></h1>
          <p class="power-splash-copy">Your offline assistant is ready. Tap once to enter and unlock the sound experience.</p>
          <button id="power-enter" type="button">Enter the experience&nbsp; →</button>
        </section>
      `;
      document.body.appendChild(splash);
      protectLogo(splash.querySelector(".power-splash-logo"));
      splash.querySelector("#power-enter").addEventListener("click", () => {
        playOpeningSound();
        splash.classList.add("power-splash-leaving");
        window.setTimeout(() => splash.remove(), 650);
      });

      let liveRecognition = null;
      let liveListening = false;

      const assistantMessages = () => [...document.querySelectorAll("#root .whitespace-pre-wrap")]
        .filter((node) => !String(node.className).includes("bg-blue-600"))
        .map((node) => node.textContent.trim())
        .filter(Boolean);

      const resetLiveButton = (button) => {
        button.classList.remove("power-speaking");
        button.querySelector("small").textContent = "Tap to speak";
      };

      const speakText = (button, text) => {
        if (!("speechSynthesis" in window)) {
          button.querySelector("small").textContent = "Voice unavailable";
          return;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1;
        utterance.pitch = 1.05;
        utterance.onend = utterance.onerror = () => resetLiveButton(button);
        button.classList.add("power-speaking");
        button.querySelector("small").textContent = "Speaking…";
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      };

      const waitForVoiceReply = (button, beforeCount, beforeLast) => {
        let attempts = 0;
        const check = () => {
          const messages = assistantMessages();
          const latest = messages[messages.length - 1];
          if ((messages.length > beforeCount && latest && latest !== beforeLast) || attempts > 70) {
            if (latest && latest !== beforeLast) speakText(button, latest);
            else resetLiveButton(button);
            return;
          }
          attempts += 1;
          window.setTimeout(check, 250);
        };
        check();
      };

      const sendVoicePrompt = (transcript, button) => {
        const input = [...document.querySelectorAll("#root input")]
          .find((node) => node.placeholder && node.placeholder.includes("Ask for code"));
        if (!input) {
          const chatButton = [...document.querySelectorAll("#root header button")]
            .find((node) => node.textContent.includes("Chat"));
          if (chatButton) {
            chatButton.click();
            window.setTimeout(() => sendVoicePrompt(transcript, button), 350);
          } else {
            button.querySelector("small").textContent = "Open Chat first";
          }
          return;
        }
        const before = assistantMessages();
        const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set;
        setter.call(input, transcript);
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.dispatchEvent(new Event("change", { bubbles: true }));
        button.querySelector("small").textContent = "Midfeast is thinking…";
        window.setTimeout(() => {
          const send = [...document.querySelectorAll("#root button")]
            .find((node) => node.textContent.trim() === "Send");
          if (send) {
            send.click();
            waitForVoiceReply(button, before.length, before[before.length - 1]);
          } else {
            resetLiveButton(button);
          }
        }, 120);
      };

      const startLive = (button) => {
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Recognition) {
          button.querySelector("small").textContent = "Mic unavailable";
          return;
        }
        if (liveListening) {
          liveRecognition.stop();
          liveListening = false;
          resetLiveButton(button);
          return;
        }
        liveRecognition = new Recognition();
        liveRecognition.continuous = false;
        liveRecognition.interimResults = false;
        liveRecognition.lang = navigator.language || "en-US";
        liveRecognition.onstart = () => {
          liveListening = true;
          button.classList.add("power-speaking");
          button.querySelector("small").textContent = "Listening…";
        };
        liveRecognition.onresult = (event) => {
          const transcript = [...event.results]
            .map((result) => result[0].transcript)
            .join(" ")
            .trim();
          if (transcript) sendVoicePrompt(transcript, button);
        };
        liveRecognition.onerror = () => {
          liveListening = false;
          button.querySelector("small").textContent = "Try the mic again";
          window.setTimeout(() => resetLiveButton(button), 1600);
        };
        liveRecognition.onend = () => {
          liveListening = false;
          if (!(window.speechSynthesis && window.speechSynthesis.speaking) && button.querySelector("small").textContent === "Listening…") {
            button.querySelector("small").textContent = "Midfeast is thinking…";
          }
        };
        try {
          liveRecognition.start();
        } catch (_) {
          liveListening = false;
          resetLiveButton(button);
        }
      };

      const downloadBlob = (blob, filename) => {
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1200);
      };

      const downloadGeneratedImage = async (button) => {
        const image = document.querySelector('#root img[alt="generated"]');
        const source = image && (image.currentSrc || image.src);
        if (!source) return;
        const original = button.textContent;
        button.textContent = "Downloading…";
        try {
          if (source.startsWith("data:")) {
            const response = await fetch(source);
            downloadBlob(await response.blob(), `midfeast-ai-${Date.now()}.png`);
          } else {
            const response = await fetch(source, { mode: "cors", cache: "no-store" });
            if (!response.ok) throw new Error("Image download failed");
            downloadBlob(await response.blob(), `midfeast-ai-${Date.now()}.png`);
          }
        } catch (_) {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;
            canvas.getContext("2d").drawImage(image, 0, 0);
            canvas.toBlob((blob) => blob && downloadBlob(blob, `midfeast-ai-${Date.now()}.png`), "image/png");
          } catch (_) {
            window.open(source, "_blank", "noopener,noreferrer");
          }
        } finally {
          window.setTimeout(() => { button.textContent = original; }, 500);
        }
      };

      const bindUtilityButtons = () => {
        const downloadButton = [...document.querySelectorAll("#root button")]
          .find((node) => node.textContent.includes("Download"));
        if (downloadButton && !downloadButton.dataset.midfeastDownload) {
          downloadButton.dataset.midfeastDownload = "true";
          downloadButton.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            downloadGeneratedImage(downloadButton);
          }, true);
        }

        const clearButton = [...document.querySelectorAll("#root button")]
          .find((node) => node.textContent.trim() === "Clear All");
        if (clearButton && !clearButton.dataset.midfeastClear) {
          clearButton.dataset.midfeastClear = "true";
          clearButton.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (!window.confirm("Clear all chat, images, and saved key?")) return;
            localStorage.removeItem("power_ai_chat_history");
            localStorage.removeItem("power_ai_image_history");
            localStorage.removeItem("power_ai_gemini_key");
            window.location.reload();
          }, true);
        }
      };

      const installEnhancements = () => {
        const header = document.querySelector("#root header");
        const brand = header && header.firstElementChild && header.firstElementChild.firstElementChild;
        const headerBar = header && header.firstElementChild;
        if (header && headerBar) {
          header.classList.add("power-modern-header");
          if (headerBar.children[1]) headerBar.children[1].style.display = "none";
          if (headerBar.children[2]) headerBar.children[2].style.display = "none";
        }
        const appRoot = document.getElementById("root");
        if (appRoot) {
          const walker = document.createTreeWalker(appRoot, NodeFilter.SHOW_TEXT);
          let textNode;
          while ((textNode = walker.nextNode())) {
            textNode.nodeValue = textNode.nodeValue
              .replaceAll("POWER AI", "MIDFEAST AI")
              .replaceAll("Power AI", "Midfeast AI");
          }
        }
        if (brand && !brand.querySelector(".power-header-logo")) {
          const oldMark = brand.querySelector("svg")?.closest(".relative") || brand.firstElementChild;
          const logo = document.createElement("img");
          logo.className = "power-header-logo";
          logo.src = logoSrc;
          logo.alt = "Midfeast AI logo";
          protectLogo(logo);
          if (oldMark) oldMark.replaceWith(logo);
        }

        if (!document.querySelector("#power-live-button")) {
          const button = document.createElement("button");
          button.id = "power-live-button";
          button.type = "button";
          button.setAttribute("aria-label", "Start a live voice conversation with Midfeast AI");
          button.innerHTML = `<span class="power-live-icon">♫</span><span class="power-live-text"><b>LIVE</b><small>Tap to speak</small></span>`;
          button.addEventListener("click", () => {
            if (window.speechSynthesis && window.speechSynthesis.speaking) {
              window.speechSynthesis.cancel();
              liveListening = false;
              if (liveRecognition) liveRecognition.stop();
              resetLiveButton(button);
              return;
            }
            startLive(button);
          });
          document.body.appendChild(button);
        }
        bindUtilityButtons();

        if (header && !document.querySelector("#power-menu-toggle")) {
          const toggle = document.createElement("button");
          toggle.id = "power-menu-toggle";
          toggle.type = "button";
          toggle.setAttribute("aria-label", "Open navigation menu");
          toggle.innerHTML = `<span class="power-menu-icon">☰</span><span>MENU</span>`;
          document.body.appendChild(toggle);

          const menu = document.createElement("aside");
          menu.id = "power-menu-panel";
          menu.setAttribute("aria-label", "Midfeast AI navigation");
          menu.innerHTML = `
            <div class="power-menu-brand">
              <img src="${logoSrc}" alt="Midfeast AI logo">
              <div><strong>MIDFEAST AI</strong><span>Honest edition</span></div>
              <button class="power-menu-close" type="button" aria-label="Close menu">×</button>
            </div>
            <div class="power-menu-label">Workspace</div>
            <nav>
              <button class="power-menu-item" data-power-target="Chat" type="button"><i>⌂</i><span>Chat assistant</span></button>
              <button class="power-menu-item" data-power-target="Real Banana" type="button"><i>✦</i><span>Real Banana images</span></button>
              <button class="power-menu-item" data-power-target="Paint" type="button"><i>✎</i><span>Paint studio</span></button>
              <button class="power-menu-item" data-power-target="History" type="button"><i>◷</i><span>History</span></button>
              <button class="power-menu-item" data-power-target="Settings" type="button"><i>⚙</i><span>Settings</span></button>
              <button class="power-menu-item" data-power-target="Developers" type="button"><i>✧</i><span>Developers</span></button>
            </nav>
            <div class="power-menu-foot">Offline assistant • local chat • honest engines</div>
          `;
          const backdrop = document.createElement("div");
          backdrop.id = "power-menu-backdrop";
          const developer = document.createElement("section");
          developer.id = "power-developer-panel";
          developer.setAttribute("aria-label", "Midfeast AI developers");
          developer.innerHTML = `
            <div class="power-developer-card">
              <div class="power-developer-glow"><img src="${logoSrc}" alt="Midfeast AI logo"></div>
              <h2>Developers</h2>
              <p>The people behind the MIDFEAST AI experience.</p>
              <div class="power-developer-grid">
                <div class="power-credit"><span class="power-credit-role">Founder</span><span class="power-credit-name">SK ANISH</span></div>
                <div class="power-credit"><span class="power-credit-role">Co Founder</span><span class="power-credit-name">SWARNADIP SHADUKHAN</span></div>
                <div class="power-credit"><span class="power-credit-role">Admin</span><span class="power-credit-name">SUSHOVON MONDOL</span></div>
                <div class="power-credit"><span class="power-credit-role">Co Admin</span><span class="power-credit-name">RHIDHIMAN MONDOL</span></div>
              </div>
              <button class="power-developer-close" type="button">Back to menu</button>
            </div>
          `;
          document.body.append(backdrop, menu, developer);
          menu.querySelectorAll("img").forEach(protectLogo);
          developer.querySelectorAll("img").forEach(protectLogo);

          const closeMenu = () => document.body.classList.remove("power-menu-open");
          const closeDevelopers = () => document.body.classList.remove("power-dev-open");
          toggle.addEventListener("click", () => document.body.classList.toggle("power-menu-open"));
          backdrop.addEventListener("click", closeMenu);
          menu.querySelector(".power-menu-close").addEventListener("click", closeMenu);
          developer.addEventListener("click", (event) => {
            if (event.target === developer) closeDevelopers();
          });
          developer.querySelector(".power-developer-close").addEventListener("click", closeDevelopers);
          menu.querySelectorAll("[data-power-target]").forEach((item) => {
            item.addEventListener("click", () => {
              const label = item.dataset.powerTarget;
              if (label === "Developers") {
                closeMenu();
                document.body.classList.add("power-dev-open");
                return;
              }
              const target = [...document.querySelectorAll("#root header button")]
                .find((button) => button.textContent.includes(label));
              if (target) target.click();
              closeMenu();
            });
          });
          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
              closeMenu();
              closeDevelopers();
            }
          });
        }
      };

      installEnhancements();
      const observer = new MutationObserver(installEnhancements);
      observer.observe(document.getElementById("root"), { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
